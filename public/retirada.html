<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0f172a" />
  <title>Retirada de Material</title>
  <style>
    body {
      margin: 0; min-height: 100vh; font-family: system-ui, -apple-system, sans-serif;
      background: #0f172a; color: #94a3b8; display: flex; align-items: center; justify-content: center;
    }
  </style>
</head>
<body>
  <p>Abrindo formulário…</p>
  <script>
    (function () {
      var q = new URLSearchParams(location.search);
      var id = (q.get('id') || q.get('shareId') || '').trim();
      if (!id) {
        document.body.innerHTML = '<p>Link inválido. Peça o link novamente ao responsável.</p>';
        return;
      }
      location.replace(location.origin + '/#/retirada-material/' + encodeURIComponent(id));
    })();
  </script>
</body>
</html>
