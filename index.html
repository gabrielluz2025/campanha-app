<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <script>
      (function () {
        // Se o SW/hosting entregar o SPA em /retirada.html?id=..., vai para o formulário (não login)
        try {
          var path = location.pathname || '';
          if (/retirada\.html$/i.test(path)) {
            var q = new URLSearchParams(location.search);
            var rid = q.get('id') || q.get('shareId');
            if (rid) {
              location.replace(location.origin + '/#/retirada-material/' + encodeURIComponent(rid));
              return;
            }
          }
        } catch (e) {}
        try {
          var t = localStorage.getItem('campanha_theme');
          if (t !== 'light' && t !== 'dark') t = 'dark';
          document.documentElement.dataset.theme = t;
          document.documentElement.style.colorScheme = t;
        } catch (e) {
          document.documentElement.dataset.theme = 'dark';
        }
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Sistema de Campanha | campanha.space</title>

    <!-- SEO -->
    <meta name="description" content="Sistema de gerenciamento de campanha eleitoral — agenda, equipe, eleitores, materiais e mais." />
    <meta name="robots" content="noindex, nofollow" />
    <link rel="canonical" href="https://campanha.space" />

    <!-- Open Graph -->
    <meta property="og:type"        content="website" />
    <meta property="og:url"         content="https://campanha.space" />
    <meta property="og:title"       content="Sistema de Campanha" />
    <meta property="og:description" content="Coordenação eleitoral centralizada — agenda, equipe, votos e mais." />
    <meta property="og:locale"      content="pt_BR" />

    <!-- PWA / mobile -->
    <meta name="theme-color" content="#0f172a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Campanha" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/pwa-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/pwa-512.png" />

    <style>
      vite-dev-tools,
      vite-error-overlay,
      vite-plugin-checker-error-overlay { display: none !important; }
    </style>
    <script>
      (function () {
        function showBootFail(msg) {
          var r = document.getElementById('root')
          if (!r || window.__campanhaBooted) return
          r.innerHTML =
            '<div style="min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:24px;background:#07090e;color:#94a3b8;font-family:system-ui,sans-serif;text-align:center">' +
            '<p style="color:#f87171;font-weight:600">Não foi possível iniciar o app</p>' +
            '<p style="font-size:14px;max-width:420px">' + String(msg || 'Erro desconhecido').replace(/</g, '&lt;') + '</p>' +
            '<a href="/reset-app.html" style="margin-top:8px;padding:10px 18px;border-radius:12px;background:#1d4ed8;color:#fff;font-weight:600;text-decoration:none">Limpar cache e tentar de novo</a></div>'
        }
        window.addEventListener('error', function (e) {
          if (!window.__campanhaBooted) showBootFail(e.message || 'Erro ao carregar scripts')
        })
        window.addEventListener('unhandledrejection', function (e) {
          if (!window.__campanhaBooted) showBootFail((e.reason && e.reason.message) || e.reason || 'Promise rejeitada')
        })
        setTimeout(function () {
          var r = document.getElementById('root')
          if (r && /Carregando/.test(r.textContent || '') && !window.__campanhaBooted) {
            showBootFail('O JavaScript não iniciou. Limpe o cache do PWA.')
          }
        }, 15000)
      })()
    </script>
  </head>
  <body>
    <div id="root" style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:#07090e;color:#94a3b8;font-family:system-ui,sans-serif">Carregando…</div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
